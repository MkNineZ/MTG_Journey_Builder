<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Journey Builder - Simulador y Editor</title>
    <link rel="stylesheet" href="css/app.css">
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <!-- Keyrune for MTG Set Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/keyrune@latest/css/keyrune.min.css">
    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Navigation Component -->
        <nav id="navigation" class="glass-nav">
            <div class="logo">MTG Journey Builder</div>
            <ul class="nav-links">
                <li><button data-target="explore" class="nav-btn">Explorar Sets</button></li>
                <li style="position: relative;"><button data-target="collection" class="nav-btn">Mi Colección</button><div class="notification-dot" id="collection-dot"></div></li>
                <li><button data-target="boosters" class="nav-btn">Sobres</button></li>
                <li><button data-target="decks" class="nav-btn">Mis Mazos</button></li>
                <li><button data-target="settings" class="nav-btn active">Configuración</button></li>
                <li><button data-target="about" class="nav-btn">Acerca de</button></li>
                <li style="margin-left: auto; display: flex; align-items: center; padding-right: 15px;">
                    <button id="global-save-btn" class="btn-mythic-accent" style="height: 40px; padding: 0 1.5rem; font-size: 0.9rem;">
                        <i class="fas fa-save"></i> Guardar Progreso
                    </button>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Screens will be dynamically injected/toggled here -->
            <section id="settings" class="screen active"></section>
            <section id="explore" class="screen"></section>
            <section id="collection" class="screen"></section>
            <section id="boosters" class="screen"></section>
            <section id="decks" class="screen"></section>
            <section id="about" class="screen"></section>
        </main>

        <!-- Global Footer -->
        <footer class="app-footer">
            <div class="footer-content">
                <img src="assets/marknine-logo.png" alt="" class="footer-logo" onerror="this.style.display='none'">
                <span>Desarrollado por <a href="#" class="author-link">MarkNineGD</a>. Datos de <strong>Scryfall</strong> y <strong>MTGJSON</strong>. Iconos de sets por <strong>Keyrune</strong>. No oficial / Fan Content.</span>
            </div>
        </footer>
        
        <!-- Cover Picker Modal -->
        <div id="cover-picker-modal" class="deck-modal-overlay" style="display: none; z-index: 10000;">
            <div class="deck-modal-content" style="background: var(--bg-color); width: 90%; max-width: 800px; max-height: 80vh; overflow-y: hidden; padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 40px rgba(0,0,0,0.8); position: relative; display: flex !important; flex-direction: column !important; align-items: flex-start !important;">
                <button id="cover-picker-close" class="deck-modal-close" style="position: absolute; top: 15px; right: 20px; font-size: 1.5rem; z-index: 10;">&times;</button>
                <div class="modal-header" style="width: 100%; margin-bottom: 20px;">
                    <h2 style="margin-top: 0; margin-bottom: 0.5rem; color: var(--accent-color);">Selecciona una Portada</h2>
                    <p style="color: var(--text-secondary); margin: 0; font-size: 0.9rem;">Elige una carta de este mazo para que su arte ilustre la portada en el dashboard principal.</p>
                </div>
                <div id="cover-picker-grid" class="cover-picker-grid">
                    <!-- Grid items injected by JS -->
                </div>
            </div>
        </div>

        <!-- Scroll to top button -->
        <button id="scroll-top-btn" class="scroll-top-btn" title="Volver arriba">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>

    <!-- ES Module Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
